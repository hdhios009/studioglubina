  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

reviews\" style=\"transition:.15s\" style-hover=\"color:var(--accent,#2E6BE0)\">Отзывы<\u002Fa>\n        <a href=\"#price\" style=\"transition:.15s\" style-hover=\"color:var(--accent,#2E6BE0)\">Стоимость<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"#form\" style=\"display:inline-flex;align-items:center;padding:11px 19px;border-radius:10px;font-weight:600;font-size:14.5px;color:#fff;background:var(--accent,#2E6BE0)\">Записаться<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" data-hero=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:70px 0 54px\">\n    <div aria-hidden=\"true\" style=\"position:absolute;inset:-30px -60px -10px;z-index:0;pointer-events:none;background:radial-gradient(150% 96% at 28% 44%, #FBF4E8 56%, rgba(251,244,232,0) 100%)\"><\u002Fdiv>\n    <div data-hero-grid=\"\" style=\"position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:0;align-items:center;max-width:760px\">\n      <div>\n        <span style=\"display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border:1px solid #DDD0B8;border-radius:8px;font-size:13.5px;font-weight:500;color:#43413c\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2FA96B\"><\u002Fspan>Бесплатная диагностика чтения · 40–60&nbsp;минут<\u002Fspan>\n        <h1 data-h1=\"\" style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.035em;margin:22px 0 18px;text-wrap:balance\">Чтобы ребёнок читал <span style=\"position:relative;white-space:nowrap;color:var(--accent,#2E6BE0)\">легко<svg viewBox=\"0 0 240 30\" preserveAspectRatio=\"none\" style=\"position:absolute;left:-3%;right:-3%;bottom:-11px;width:106%;height:18px;overflow:visible\"><path d=\"M6 18 C 70 4, 150 28, 234 10\" fill=\"none\" stroke=\"#F5B916\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"320\" stroke-dashoffset=\"320\" style=\"animation:draw 1.1s .35s ease forwards\"><\u002Fpath><\u002Fsvg><\u002Fspan>, понимал и&nbsp;запоминал<\u002Fh1>\n        <div data-diagline=\"\" style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(14px,4.1vw,30px);letter-spacing:-.03em;white-space:nowrap;margin:0 0 18px\">Первая диагностика&nbsp;— <span style=\"color:#E5392E\">0&nbsp;рублей<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:18.5px;line-height:1.62;color:#54514b;max-width:47ch;margin:0 0 28px;text-wrap:pretty\">Покажем, что именно мешает ребёнку&nbsp;— <b style=\"color:#1C1B29;font-weight:600\">скорость, внимание, память или&nbsp;понимание текста<\u002Fb>, и&nbsp;составим понятный план занятий.<\u002Fp>\n        <div data-hero-cta=\"\" style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px\">\n          <a href=\"#form\" style=\"display:inline-flex;align-items:center;padding:15px 26px;border-radius:10px;font-weight:600;font-size:15.5px;color:#fff;background:#E5392E;transition:background .18s\" style-hover=\"background:#cf2f25\">Записаться на&nbsp;бесплатную диагностику<\u002Fa>\n          <a href=\"#gift\" style=\"display:inline-flex;align-items:center;gap:8px;padding:15px 24px;border-radius:10px;font-weight:600;font-size:15.5px;color:#1C1B29;background:#F5B916;transition:background .18s\" style-hover=\"background:#e5aa0c\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7S9 3 6.5 3 4 5 4 5s.5 2 3 2h5zM12 7s3-4 5.5-4S20 5 20 5s-.5 2-3 2h-5z\" stroke=\"#1C1B29\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Получить подарок<\u002Fa>\n        <\u002Fdiv>\n        <div data-trust=\"\" style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:34px\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid #E4D8C2;border-radius:999px;background:#FFFDF9;font-size:13.5px;font-weight:600\"><span style=\"color:#F5B916;letter-spacing:1px\">★★★★★<\u002Fspan>5.0 на&nbsp;Яндекс&nbsp;Картах<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid #E4D8C2;border-radius:999px;background:#FFFDF9;font-size:13.5px;font-weight:600\">Реальные отзывы родителей<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid #E4D8C2;border-radius:999px;background:#FFFDF9;font-size:13.5px;font-weight:600\">Мини-группы до&nbsp;6&nbsp;детей<\u002Fspan>\n        <\u002Fdiv>\n        <div data-proof=\"\" style=\"display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;border:1px solid #E4D8C2;border-radius:14px;background:#FFFDF9\">\n          <div style=\"padding:18px 20px;border-right:1px solid #E4D8C2\"><strong style=\"display:block;font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.04em;color:#E5392E\">600+<\u002Fstrong><span style=\"display:block;color:#6f6a64;font-size:12.5px;margin-top:6px;line-height:1.35\">детей прошли обучение<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:18px 20px;border-right:1px solid #E4D8C2\"><strong style=\"display:block;font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.04em;color:#E5392E\">7–14<\u002Fstrong><span style=\"display:block;color:#6f6a64;font-size:12.5px;margin-top:6px;line-height:1.35\">возраст детей для занятий<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:18px 20px\"><strong style=\"display:block;font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.04em;color:#E5392E\">до 6<\u002Fstrong><span style=\"display:block;color:#6f6a64;font-size:12.5px;margin-top:6px;line-height:1.35\">детей в мини-группе<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      \n      \n\n  <!-- PAIN -->\n  <section data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Узнаёте своего ребёнка?<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#6f6a64;max-width:36ch;margin:0;text-wrap:pretty\">Мы не пугаем родителей. Мы показываем причину и&nbsp;понятный путь, как ребёнку читать легче.<\u002Fp>\n    <\u002Fdiv>\n    <div data-pain=\"\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n      <article style=\"padding:26px 24px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2\"><div style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:15px;color:#E5392E;margin-bottom:14px\">01<\u002Fdiv><h3 style=\"font-family:'Onest';font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.12;margin:0 0 9px\">Читает медленно<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.5;font-size:14.5px\">Долго собирает слова, теряет строку, быстро устаёт.<\u002Fp><\u002Farticle>\n      <article style=\"padding:26px 24px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2\"><div style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:15px;color:#E5392E;margin-bottom:14px\">02<\u002Fdiv><h3 style=\"font-family:'Onest';font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.12;margin:0 0 9px\">Не понимает текст<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.5;font-size:14.5px\">Прочитал страницу, но не может объяснить смысл.<\u002Fp><\u002Farticle>\n      <article style=\"padding:26px 24px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2\"><div style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:15px;color:#E5392E;margin-bottom:14px\">03<\u002Fdiv><h3 style=\"font-family:'Onest';font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.12;margin:0 0 9px\">Не пересказывает<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.5;font-size:14.5px\">Сложно выделить главное и&nbsp;сказать своими словами.<\u002Fp><\u002Farticle>\n      <article style=\"padding:26px 24px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2\"><div style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:15px;color:#E5392E;margin-bottom:14px\">04<\u002Fdiv><h3 style=\"font-family:'Onest';font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.12;margin:0 0 9px\">Домашка до вечера<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.5;font-size:14.5px\">Задания растягиваются, ребёнок ждёт подсказку взрослого.<\u002Fp><\u002Farticle>\n    <\u002Fdiv>\n    <div data-cta=\"\" style=\"display:flex;justify-content:center;margin-top:32px\"><a href=\"#form\" style=\"display:inline-flex;align-items:center;padding:16px 32px;border-radius:10px;font-weight:700;font-size:16px;color:#fff;background:#E5392E;box-shadow:0 12px 26px rgba(229,57,46,.3);transition:background .18s\" style-hover=\"background:#cf2f25\">Записаться на&nbsp;бесплатную диагностику<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY HARD (light) -->\n  <section data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:20px 0 60px\">\n    <div style=\"border:1px solid #E4D8C2;border-radius:20px;background:#FFFDF9;padding:clamp(28px,5vw,52px);max-width:900px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(27px,3.8vw,44px);letter-spacing:-.03em;line-height:1.06;margin:0\">Он не ленится. Ему просто трудно читать.<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.66;color:#43413c;margin:20px 0 0;max-width:60ch;text-wrap:pretty\">Когда ребёнок тратит все силы на&nbsp;сами слова, он быстро устаёт, злится, избегает книг и&nbsp;боится больших текстов.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DIRECTIONS -->\n  <section id=\"directions\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">КотиксУМ&nbsp;— центр интеллекта, а&nbsp;не один курс<\u002Fh2>\n      <p style=\"display:none\"><\u002Fp>\n    <\u002Fdiv>\n    <div data-dirs=\"\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #2E6BE0\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Скорочтение<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Ребёнок читает быстрее, лучше понимает и&nbsp;пересказывает текст.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #2FA96B\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Подготовка к&nbsp;школе<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Готовим к&nbsp;1&nbsp;классу: чтение, письмо, счёт, логика, внимание и&nbsp;речь.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #E5392E\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Английский язык<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Помогаем говорить, понимать задания и&nbsp;увереннее отвечать на&nbsp;уроках.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #F5B916\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Память и&nbsp;внимание<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Тренируем концентрацию, запоминание и&nbsp;самостоятельность.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #2E6BE0\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Логика и&nbsp;мышление<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Развиваем умение рассуждать, анализировать и&nbsp;находить решения.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:28px;border-top:5px solid #2FA96B\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 10px\">Каллиграфия и&nbsp;грамотность<\u002Fh3><p style=\"margin:0 0 20px;color:#6f6a64;line-height:1.5;font-size:15px\">Улучшаем почерк, аккуратность и&nbsp;уверенность в&nbsp;письме.<\u002Fp><a href=\"#form\" style=\"margin-top:auto;font-weight:600;font-size:15px;color:#2E6BE0\">Записаться&nbsp;→<\u002Fa><\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DIAGNOSTICS -->\n  <section id=\"diag\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Что проверяем за первую встречу<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#6f6a64;max-width:36ch;margin:0;text-wrap:pretty\">Родитель видит не общие слова, а&nbsp;конкретные показатели ребёнка.<\u002Fp>\n    <\u002Fdiv>\n    <div data-diag=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <article style=\"padding:28px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2;border-left:4px solid #2E6BE0\"><h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 9px\">Скорость чтения<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:15px\">Смотрим текущий темп, ошибки, остановки и&nbsp;где ребёнок теряет внимание.<\u002Fp><\u002Farticle>\n      <article style=\"padding:28px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2;border-left:4px solid #E5392E\"><h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 9px\">Понимание текста<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:15px\">Проверяем, понимает ли ребёнок смысл, отвечает ли на&nbsp;вопросы и&nbsp;видит ли главное.<\u002Fp><\u002Farticle>\n      <article style=\"padding:28px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2;border-left:4px solid #2FA96B\"><h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 9px\">Память и внимание<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:15px\">Смотрим, как ребёнок удерживает информацию и&nbsp;насколько быстро переключается.<\u002Fp><\u002Farticle>\n      <article style=\"padding:28px;border-radius:14px;background:#FFFDF9;border:1px solid #E4D8C2;border-left:4px solid #F5B916\"><h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 9px\">План развития<\u002Fh3><p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:15px\">Объясняем родителю, с&nbsp;чего начать и&nbsp;какой формат занятий подойдёт.<\u002Fp><\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BEFORE / AFTER -->\n  <section id=\"result\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Что меняется после занятий<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#6f6a64;max-width:36ch;margin:0;text-wrap:pretty\">Цель — не просто быстрее читать, а&nbsp;понимать, запоминать и&nbsp;увереннее учиться.<\u002Fp>\n    <\u002Fdiv>\n    <div data-ba=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div style=\"padding:34px;border-radius:16px;background:#FBEAE8;border:1px solid #F0C7C2\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:23px;letter-spacing:-.02em;margin:0 0 22px;color:#E5392E\">Сейчас<\u002Fh3><ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:15px\">\n        <li style=\"display:flex;gap:12px;color:#54514b;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:5px\"><path d=\"M4 8 L12 8\" stroke=\"#E5392E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>читает медленно и&nbsp;быстро устаёт<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#54514b;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:5px\"><path d=\"M4 8 L12 8\" stroke=\"#E5392E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>забывает, что только что прочитал<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#54514b;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:5px\"><path d=\"M4 8 L12 8\" stroke=\"#E5392E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>не может пересказать своими словами<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#54514b;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:5px\"><path d=\"M4 8 L12 8\" stroke=\"#E5392E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>делает домашку только с&nbsp;родителем<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n      <div style=\"padding:34px;border-radius:16px;background:#EAF6EF;border:1px solid #BDE6D2\"><h3 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600;font-size:23px;letter-spacing:-.02em;margin:0 0 22px;color:#1F7A54\">После работы<\u002Fh3><ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:15px\">\n        <li style=\"display:flex;gap:12px;color:#1E4536;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:4px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#1F7A54\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>читает спокойнее и&nbsp;увереннее<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#1E4536;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:4px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#1F7A54\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>лучше понимает смысл текста<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#1E4536;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:4px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#1F7A54\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>выделяет главное и&nbsp;пересказывает<\u002Fli>\n        <li style=\"display:flex;gap:12px;color:#1E4536;line-height:1.45;font-size:16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:4px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#1F7A54\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>быстрее справляется с&nbsp;заданиями<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-cta=\"\" style=\"display:flex;justify-content:center;margin-top:32px\"><a href=\"#form\" style=\"display:inline-flex;align-items:center;padding:16px 32px;border-radius:10px;font-weight:700;font-size:16px;color:#fff;background:#E5392E;box-shadow:0 12px 26px rgba(229,57,46,.3);transition:background .18s\" style-hover=\"background:#cf2f25\">Записаться на&nbsp;бесплатную диагностику<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LIVE CENTER -->\n  <section data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:20px 0 60px\">\n    <div style=\"border:1px solid #E4D8C2;border-radius:20px;background:#FFFDF9;padding:clamp(28px,5vw,52px)\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(27px,3.8vw,44px);letter-spacing:-.03em;line-height:1.06;margin:0;max-width:22ch\">Живой центр, где ребёнка видят лично<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.6;color:#43413c;margin:18px 0 30px;max-width:66ch;text-wrap:pretty\">На занятии педагог замечает, где ребёнок теряет внимание, что мешает понимать текст и&nbsp;почему сложно пересказывать. Родитель получает <b style=\"color:#1C1B29;font-weight:600\">не общие слова, а&nbsp;понятную обратную связь<\u002Fb>.<\u002Fp>\n      <div data-live=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <div style=\"padding:26px;border-radius:16px;background:#FFFDF9;border:1px solid #E4D8C2;display:flex;gap:12px;align-items:flex-start\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><div><div style=\"font-weight:700;font-size:16px;margin-bottom:5px\">Видим каждого ребёнка<\u002Fdiv><span style=\"color:#6f6a64;line-height:1.5;font-size:14.5px\">Замечаем, где теряется внимание и&nbsp;что мешает понимать текст.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:26px;border-radius:16px;background:#FFFDF9;border:1px solid #E4D8C2;display:flex;gap:12px;align-items:flex-start\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><div><div style=\"font-weight:700;font-size:16px;margin-bottom:5px\">Понятная обратная связь<\u002Fdiv><span style=\"color:#6f6a64;line-height:1.5;font-size:14.5px\">Родитель получает конкретику после занятий, а&nbsp;не общие слова.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:26px;border-radius:16px;background:#FFFDF9;border:1px solid #E4D8C2;display:flex;gap:12px;align-items:flex-start\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><div><div style=\"font-weight:700;font-size:16px;margin-bottom:5px\">Мини-группы до&nbsp;6&nbsp;детей<\u002Fdiv><span style=\"color:#6f6a64;line-height:1.5;font-size:14.5px\">Педагог успевает к&nbsp;каждому и&nbsp;ведёт по&nbsp;его уровню.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:26px;border-radius:16px;background:#FFFDF9;border:1px solid #E4D8C2;display:flex;gap:12px;align-items:flex-start\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><div><div style=\"font-weight:700;font-size:16px;margin-bottom:5px\">Понятный план занятий<\u002Fdiv><span style=\"color:#6f6a64;line-height:1.5;font-size:14.5px\">Родитель видит, что делаем и&nbsp;почему это работает.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY -->\n  <section data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Почему родители выбирают КотиксУМ<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#6f6a64;max-width:36ch;margin:0;text-wrap:pretty\">Системный центр, внимательный к&nbsp;каждому ребёнку — это видно с&nbsp;первой встречи.<\u002Fp>\n    <\u002Fdiv>\n    <div data-why=\"\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n      <div style=\"border-radius:14px;padding:26px;background:#FFFDF9;border:1px solid #E4D8C2\"><b style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:40px;letter-spacing:-.05em;display:block;color:#E5392E;margin-bottom:9px\">8<\u002Fb><span style=\"font-weight:600;font-size:17px;letter-spacing:-.01em;display:block;margin-bottom:9px\">лет опыта<\u002Fspan><p style=\"margin:0;color:#6f6a64;line-height:1.45;font-size:14px\">на чтении, внимании и&nbsp;мышлении<\u002Fp><\u002Fdiv>\n      <div style=\"border-radius:14px;padding:26px;background:#FFFDF9;border:1px solid #E4D8C2\"><b style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:40px;letter-spacing:-.05em;display:block;color:#E5392E;margin-bottom:9px\">6<\u002Fb><span style=\"font-weight:600;font-size:17px;letter-spacing:-.01em;display:block;margin-bottom:9px\">детей максимум<\u002Fspan><p style=\"margin:0;color:#6f6a64;line-height:1.45;font-size:14px\">в мини-группе — педагог видит каждого<\u002Fp><\u002Fdiv>\n      <div style=\"border-radius:14px;padding:26px;background:#FFFDF9;border:1px solid #E4D8C2\"><b style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:40px;letter-spacing:-.05em;display:block;color:#E5392E;margin-bottom:9px\">1<\u002Fb><span style=\"font-weight:600;font-size:17px;letter-spacing:-.01em;display:block;margin-botto 5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font-weight:600;font-size:15px;line-height:1.35\">Бесплатная первая диагностика<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:11px;align-items:flex-start;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:18px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:1px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font-weight:600;font-size:15px;line-height:1.35\">Офлайн-занятия у&nbsp;м.&nbsp;Планерная<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:11px;align-items:flex-start;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:18px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:1px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#2FA96B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font-weight:600;font-size:15px;line-height:1.35\">Индивидуальный подход к&nbsp;ребёнку<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-cta=\"\" style=\"display:flex;justify-content:center;margin-top:32px\"><a href=\"#form\" style=\"display:inline-flex;align-items:center;padding:16px 32px;border-radius:10px;font-weight:700;font-size:16px;color:#fff;background:#E5392E;box-shadow:0 12px 26px rgba(229,57,46,.3);transition:background .18s\" style-hover=\"background:#cf2f25\">Записаться на&nbsp;бесплатную диагностику<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- REVIEWS -->\n  <section id=\"reviews\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px\">\n      <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Отзывы родителей на&nbsp;Яндекс&nbsp;Картах<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#6f6a64;max-width:36ch;margin:0;text-wrap:pretty\">Настоящие отзывы с&nbsp;карточки центра на&nbsp;Яндекс&nbsp;Картах.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reviews=\"\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start\">\n      <article style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:26px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px\"><b style=\"font-size:15.5px\">Родитель ученика<\u002Fb><span style=\"font-size:12.5px;color:#9b9590\">19 мая 2026<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#F5B916;letter-spacing:2px;font-size:15px;margin-bottom:14px\">★★★★★<\u002Fdiv>\n        <div style=\"font-weight:600;font-size:16px;line-height:1.4;margin-bottom:12px;color:#1C1B29\">«Раньше не любили читать — теперь сам садится и&nbsp;читает»<\u002Fdiv>\n        <p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:14px;text-wrap:pretty\">Ходим на&nbsp;скорочтение с&nbsp;декабря 2025&nbsp;года, ребёнок всегда идёт с&nbsp;удовольствием, педагог заинтересовал. Потихоньку приходит желание к&nbsp;чтению. Спасибо, что находите подход к&nbsp;детям.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:26px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px\"><b style=\"font-size:15.5px\">Родитель ученика<\u002Fb><span style=\"font-size:12.5px;color:#9b9590\">14 января 2026<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#F5B916;letter-spacing:2px;font-size:15px;margin-bottom:14px\">★★★★★<\u002Fdiv>\n        <div style=\"font-weight:600;font-size:16px;line-height:1.4;margin-bottom:12px;color:#1C1B29\">«Небольшие группы и&nbsp;разносторонние задания»<\u002Fdiv>\n        <p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:14px;text-wrap:pretty\">Ходим второй месяц, ребёнку очень нравится, группы действительно небольшие. Педагог много делает с&nbsp;детьми: на&nbsp;логику, память, счёт, внимательность. Спасибо за&nbsp;такой подход.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:16px;padding:26px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px\"><b style=\"font-size:15.5px\">Родитель ученика<\u002Fb><span style=\"font-size:12.5px;color:#9b9590\">22 октября 2025<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#F5B916;letter-spacing:2px;font-size:15px;margin-bottom:14px\">★★★★★<\u002Fdiv>\n        <div style=\"font-weight:600;font-size:16px;line-height:1.4;margin-bottom:12px;color:#1C1B29\">«Бесплатное пробное и&nbsp;живая обратная связь педагогов»<\u002Fdiv>\n        <p style=\"margin:0;color:#6f6a64;line-height:1.55;font-size:14px;text-wrap:pretty\">Администратор подбирает время, начиная с&nbsp;пробного занятия — оно бесплатное. Педагоги молодые, но&nbsp;высококвалифицированные, прислушиваются к&nbsp;ребёнку. Однозначно рекомендую.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <!-- FAQ -->\n  <section id=\"faq\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-head=\"\" style=\"margin-bottom:34px\"><h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Частые вопросы<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;gap:12px;max-width:900px\"><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">Какие направления есть?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Скорочтение, подготовка к школе, английский, память и внимание, логика и мышление, каллиграфия и грамотность.<\u002Fdiv><\u002Fdiv><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">Сколько стоит диагностика?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Диагностика бесплатная — 0 ₽.<\u002Fdiv><\u002Fdiv><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">Сколько длится диагностика?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Обычно 40–60 минут.<\u002Fdiv><\u002Fdiv><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">С какого возраста можно заниматься?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Основное направление скорочтения подходит детям 7–14 лет.<\u002Fdiv><\u002Fdiv><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">Где проходит занятие?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Офлайн, в мини-группе до 6 детей.<\u002Fdiv><\u002Fdiv><div style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:14px;padding:22px 24px\"><div style=\"font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:-.01em\">Можно ли понять проблему за одну диагностику?<\u002Fdiv><div style=\"color:#6f6a64;line-height:1.55;font-size:15px\">Да, на первой встрече педагог видит скорость чтения, понимание, внимание и память и даёт родителю понятную обратную связь.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GIFT -->\n  <section id=\"gift\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:20px 0 40px\">\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:#FFFDF9;border:1px solid #E4D8C2;border-left:4px solid #F5B916;border-radius:18px;padding:clamp(22px,4vw,34px)\">\n      <div style=\"width:64px;height:64px;border-radius:16px;background:#FEF3D3;display:grid;place-items:center;flex:0 0 auto\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7S9 3 6.5 3 4 5 4 5s.5 2 3 2h5zM12 7s3-4 5.5-4S20 5 20 5s-.5 2-3 2h-5z\" stroke=\"#B5760C\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#B5760C;margin-bottom:8px\">Подарок после заявки<\u002Fdiv>\n        <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:-.02em;line-height:1.1;margin:0 0 8px\">Дневник скорочтения на&nbsp;3&nbsp;дня<\u002Fh2>\n        <p style=\"margin:0;color:#54514b;line-height:1.55;font-size:15.5px;text-wrap:pretty\">После записи на&nbsp;бесплатную диагностику мы&nbsp;пришлём полезный материал для ребёнка. Для скорочтения&nbsp;— дневник на&nbsp;3&nbsp;дня с&nbsp;упражнениями на&nbsp;внимание, память и&nbsp;чтение. Для подготовки к&nbsp;школе&nbsp;— задания на&nbsp;память, внимание, чтение, логику и&nbsp;счёт.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRICE + FORM -->\n  <section id=\"price\" data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:60px 0\">\n    <div data-offer=\"\" style=\"display:grid;grid-template-columns:.86fr 1.14fr;gap:16px;align-items:stretch\">\n      <div style=\"position:relative;border-radius:20px;padding:38px;color:#fff;background:#E5392E;overflow:hidden\">\n        <svg viewBox=\"0 0 360 120\" preserveAspectRatio=\"none\" style=\"position:absolute;left:0;right:0;bottom:0;width:100%;height:120px;opacity:.5\"><path d=\"M-20 80 C 80 30, 160 110, 240 70 S 380 30, 420 80\" fill=\"none\" stroke=\"rgba(255,255,255,.4)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13px;color:#fff\">Абонемент<\u002Fspan>\n        <div data-price=\"\" style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:58px;letter-spacing:-.05em;line-height:.92;margin:26px 0 10px;color:#fff\">9 600<small style=\"font-size:24px;letter-spacing:-.02em\"> ₽<\u002Fsmall><\u002Fdiv>\n        <p style=\"color:rgba(255,255,255,.9);line-height:1.6;margin:0 0 26px;font-size:15px;text-wrap:pretty\">8 занятий в&nbsp;мини-группе. Тренируем чтение, понимание, память, внимание и&nbsp;пересказ.<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:13px;position:relative;z-index:2\">\n          <li style=\"display:flex;gap:11px;color:#fff;font-size:15.5px;font-weight:500\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:3px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>8 занятий<\u002Fli>\n          <li style=\"display:flex;gap:11px;color:#fff;font-size:15.5px;font-weight:500\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:3px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Мини-группа 6&nbsp;человек<\u002Fli>\n          <li style=\"display:flex;gap:11px;color:#fff;font-size:15.5px;font-weight:500\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:3px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Обратная связь родителю<\u002Fli>\n          <li style=\"display:flex;gap:11px;color:#fff;font-size:15.5px;font-weight:500\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" style=\"flex:0 0 auto;margin-top:3px\"><path d=\"M3 8.5 L6.5 12 L13 4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Подбор по уровню ребёнка<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div id=\"form\" style=\"background:#FFFDF9;border:1px solid #E4D8C2;border-radius:20px;padding:40px\">\n        <h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(26px,3.2vw,38px);letter-spacing:-.03em;line-height:1.06;margin:0 0 12px\">Запишитесь на <span style=\"position:relative;white-space:nowrap;color:#E5392E\">бесплатную диагностику<svg viewBox=\"0 0 240 30\" preserveAspectRatio=\"none\" style=\"position:absolute;left:-2%;right:-2%;bottom:-9px;width:104%;height:15px;overflow:visible\"><path d=\"M6 18 C 70 4, 150 28, 234 10\" fill=\"none\" stroke=\"#F5B916\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fh2>\n        <p style=\"color:#6f6a64;line-height:1.6;font-size:16px;margin:0;text-wrap:pretty\">Проверим чтение, внимание, память и&nbsp;понимание текста. После заявки пришлём полезный подарок для занятий дома.<\u002Fp>\n        <div data-formgrid=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px\">\n          <input id=\"f_name\" placeholder=\"Ваше имя\" style=\"width:100%;border:1px solid #DDD0B8;border-radius:10px;padding:15px 16px;font:inherit;font-size:15px;background:#fff;outline:0\" style-focus=\"border-color:var(--accent,#2E6BE0)\">\n          <input id=\"f_phone\" inputmode=\"tel\" placeholder=\"+7 (___) ___-__-__\" style=\"width:100%;border:1px solid #DDD0B8;border-radius:10px;padding:15px 16px;font:inherit;font-size:15px;background:#fff;outline:0\" style-focus=\"border-color:var(--accent,#2E6BE0)\">\n          <input id=\"f_age\" inputmode=\"numeric\" placeholder=\"Возраст ребёнка\" style=\"grid-column:1/-1;width:100%;border:1px solid #DDD0B8;border-radius:10px;padding:15px 16px;font:inherit;font-size:15px;background:#fff;outline:0\" style-focus=\"border-color:var(--accent,#2E6BE0)\">\n          <button type=\"button\" id=\"f_submit\" data-submit=\"\" style=\"grid-column:1/-1;width:100%;border:0;cursor:pointer;padding:16px;border-radius:10px;font-family:'Onest';font-weight:700;font-size:16px;color:#fff;background:#E5392E;box-shadow:0 12px 26px rgba(229,57,46,.32);transition:background .18s\" style-hover=\"background:#cf2f25\">Записаться и&nbsp;получить подарок<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#9b9590;margin-top:12px;line-height:1.55\">Нажимая кнопку, вы соглашаетесь на&nbsp;обработку персональных данных.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- QUICK LINKS -->\n  <section data-sec=\"\" class=\"wrap\" style=\"position:relative;z-index:2;padding:20px 0 40px\">\n    <div data-head=\"\" style=\"margin-bottom:22px\"><h2 style=\"font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.035em;line-height:1.04;margin:0\">Частые запросы родителей<\u002Fh2><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\"><a href=\"/chitaet-medlenno/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Медленно читает<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Проверим скорость чтения<\u002Fdiv><\u002Fa><a href=\"/ne-ponimaet-tekst/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Не понимает текст<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Проверим понимание и внимание<\u002Fdiv><\u002Fa><a href=\"/ne-mozhet-pereskazat/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Не может пересказать<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Научим выделять главное<\u002Fdiv><\u002Fa><a href=\"/domashka-do-vechera/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Домашка до вечера<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Поможем учиться быстрее<\u002Fdiv><\u002Fa><a href=\"/zabyvaet-prochitannoe/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Забывает текст<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Развиваем память и внимание<\u002Fdiv><\u002Fa><a href=\"/boitsya-otvechat/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Боится отвечать<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Поможем стать увереннее<\u002Fdiv><\u002Fa><a href=\"/oshibki-po-nevnimatelnosti/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Ошибки по вниманию<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Проверим концентрацию<\u002Fdiv><\u002Fa><a href=\"/skorochtenie-deti/\" style=\"display:block;flex:1 1 240px;background:#FFFDF9;border:1px solid #E4D8C2;border-radius:12px;padding:16px 18px\"><div style=\"font-weight:700;font-size:15px;margin-bottom:4px\">Скорочтение детям<\u002Fdiv><div style=\"color:#6f6a64;font-size:13.5px\">Диагностика и занятия<\u002Fdiv><\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <footer class=\"wrap\" style=\"position:relative;z-index:2;padding:24px 0 52px\">\n    <div data-footer=\"\" style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid #E4D8C2;padding-top:28px;color:#6f6a64;font-size:14.5px\">\n      <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid #E4D8C2;display:grid;place-items:center;overflow:hidden\"><img src=\"873afeda-bcf8-4aae-9789-0e3963ac859b\" alt=\"КотиксУМ\" style=\"width:34px;height:34px;object-fit:contain\"><\u002Fspan><div><strong style=\"color:#1C1B29;font-family:'Unbounded','Onest',system-ui,-apple-system,sans-serif;font-weight:600\">КотиксУМ<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;gap:8px;justify-items:start\">\n        <span style=\"font-size:13px;color:#9b9590\">Сайт создан в&nbsp;студии <a href=\"https://studioglubina.ru/\" target=\"_blank\" rel=\"noopener\" style=\"color:#2E6BE0;font-weight:600\">ГЛУБИНА<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n\n\n<\u002Fdiv>\n\n\n\n<script>\n(function(){\n  function wire(attr,onE,offE){\n    document.querySelectorAll('['+attr+']').forEach(function(el){\n      var extra=el.getAttribute(attr); if(!extra) return;\n      var base=el.getAttribute('style')||'';\n      el.addEventListener(onE,function(){el.setAttribute('style',base+';'+extra);});\n      el.addEventListener(offE,function(){el.setAttribute('style',base);});\n    });\n  }\n  wire('style-hover','mouseenter','mouseleave');\n  wire('style-focus','focus','blur');\n  document.querySelectorAll('[style-active]').forEach(function(el){\n    var extra=el.getAttribute('style-active'); if(!extra) return;\n    var base=el.getAttribute('style')||'';\n    el.addEventListener('mousedown',function(){el.setAttribute('style',base+';'+extra);});\n    el.addEventListener('mouseup',function(){el.setAttribute('style',base);});\n    el.addEventListener('mouseleave',function(){el.setAttribute('style',base);});\n  });\n  var nameEl=document.getElementById('f_name');\n  var phoneEl=document.getElementById('f_phone');\n  var ageEl=document.getElementById('f_age');\n  var btn=document.getElementById('f_submit');\n  var prevPhone='';\n  function fmt(raw,prev){\n    var d=(raw||'').replace(/\\D/g,'');\n    if(d.indexOf('8')===0) d='7'+d.slice(1);\n    else if(d.indexOf('9')===0) d='7'+d;\n    else if(d && d[0]!=='7') d='7'+d;\n    d=d.slice(0,11);\n    if(prev!=null && (raw||'').length<prev.length){var pd=prev.replace(/\\D/g,''); if(pd===d) d=d.slice(0,-1);}\n    var r=d.slice(1);\n    if(r.length===0) return '';\n    var out='+7 ('+r.slice(0,3);\n    if(r.length>=3) out+=')';\n    if(r.length>3) out+=' '+r.slice(3,6);\n    if(r.length>6) out+='-'+r.slice(6,8);\n    if(r.length>8) out+='-'+r.slice(8,10);\n    return out;\n  }\n  if(phoneEl){phoneEl.addEventListener('input',function(){var v=fmt(phoneEl.value,prevPhone);phoneEl.value=v;prevPhone=v;});}\n  if(ageEl){ageEl.addEventListener('input',function(){ageEl.value=ageEl.value.replace(/[^0-9]/g,'').slice(0,2);});}\n  function validPhone(v){var d=(v||'').replace(/\\D/g,''); return d.length===11 && d[0]==='7';}\n  if(btn){\n    btn.addEventListener('click',function(){ /* демо: без отправки и без всплывающих окон */ });\n  }\n})();\n<\u002Fscript>\n\n\n<\u002Fsection><\u002Fdiv><\u002Fbody><\u002Fhtml>"
  </script>
