<!DOCTYPE html>

    }
    .err404__code{
      font-family:var(--ff-display);

      letter-spacing:-.04em;
      line-height:1;
      color:var(--text);
      margin:0;
    }
    .err404__text{
      margin:20px auto 0;

      font-size:clamp(16px,2.2vw,18px);

    .err404__cta{margin-top:36px}
