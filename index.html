document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lass=\"j-bottomfade\" style=\"position:absolute;left:0;right:0;bottom:0;height:42vh;background:linear-gradient(180deg,rgba(6,24,47,0) 0%,rgba(6,24,47,.55) 55%,#06182f 100%);opacity:0;pointer-events:none\"><\u002Fdiv>\n\n      <!-- depth meter -->\n      <div style=\"position:absolute;left:clamp(16px,4vw,52px);top:50%;transform:translateY(-50%);height:46vh;display:flex;align-items:stretch;gap:14px;z-index:5;pointer-events:none\">\n        <div style=\"position:relative;width:2px;background:linear-gradient(180deg,rgba(108,198,255,.55),rgba(108,198,255,.08))\">\n          <span class=\"depth-marker\" style=\"position:absolute;left:50%;top:8%;width:11px;height:11px;border-radius:50%;background:#6cc6ff;transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(108,198,255,.9)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;justify-content:space-between;font-family:'Press Start 2P',monospace;font-size:8px;color:rgba(160,200,235,.7);letter-spacing:.04em\">\n          <span>0 М<\u002Fspan>\n          <span style=\"align-self:flex-start;display:flex;align-items:baseline;gap:5px;color:#bfe2ff\"><b class=\"depth-val\" style=\"font-size:13px;color:#6cc6ff\">0<\u002Fb>М<\u002Fspan>\n          <span>1000 М<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- STATIONS -->\n      <div style=\"position:absolute;inset:0;display:grid;place-items:center;padding:0 clamp(24px,7vw,120px)\">\n\n        <div class=\"station on\" data-band=\"hero\" style=\"position:absolute;max-width:880px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.18em;color:#bfe6ff;text-shadow:0 2px 14px rgba(0,18,38,.92),0 0 20px rgba(108,198,255,.55)\">ВЕБ-СТУДИЯ ПОЛНОГО ПОГРУЖЕНИЯ<\u002Fspan>\n          <h1 style=\"margin:0;font-size:clamp(40px,7.6vw,104px);line-height:.98;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 8px 40px rgba(2,8,20,.6)\">Сайт — это<br>вершина айсберга<\u002Fh1>\n          <p style=\"margin:0;max-width:560px;font-size:clamp(15px,1.7vw,20px);line-height:1.55;color:#c2d8ec\">То, что видит пользователь, — лишь малая часть. Прокручивайте вниз и погрузитесь под воду, чтобы увидеть, на чём всё держится.<\u002Fp>\n          <div class=\"scroll-hint\" style=\"margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.14em;color:rgba(180,215,245,.8);transition:opacity .5s\">\n            <span>ЛИСТАЙТЕ ВНИЗ<\u002Fspan>\n            <span style=\"animation:bob 1.8s ease-in-out infinite;font-size:20px;color:#6cc6ff\">↓<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"1\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−100 М · ВЕРХУШКА<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">Красивый интерфейс — это только верхушка<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Это первое, что замечают за секунду до прокрутки. Но это лишь 10% от того, что делает сайт по-настоящему сильным.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"2\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−250 М · ПЕРВОЕ ВПЕЧАТЛЕНИЕ<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">Типографика, цвет и ритм<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Правильные шрифты, выверенные отступы и сетка. Гость ещё не читал текст, но уже доверяет — потому что всё на своих местах.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"3\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−400 М · ПОД ВОДОЙ<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">Остальные 90% скрыты под водой<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Структура страниц, логика навигации, продуманные сценарии. То, чего не видно глазом, но без чего всё разваливается.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"4\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−550 М · ГЛУБЖЕ<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">Скорость, оптимизация и SEO<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Сайт грузится за доли секунды и находится в поиске. Лёгкий код и чистая разметка работают на вас круглосуточно.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"5\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−700 М · ЕЩЁ ГЛУБЖЕ<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">UX, анимации и отклик<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Плавные переходы, реакция на каждое действие, ничего не тормозит. Глубина, которую чувствуешь, даже если не видишь.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"6\" style=\"position:absolute;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,5vw,56px);background:radial-gradient(62% 62% at 50% 50%,rgba(3,10,22,.5),transparent 74%)\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#6cc6ff\">−850 М · ФУНДАМЕНТ<\u002Fspan>\n          <h2 style=\"margin:14px 0 0;font-size:clamp(30px,4.6vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 26px rgba(0,10,26,.72)\">Чистый код, адаптив и доступность<\u002Fh2>\n          <p style=\"margin:18px 0 0;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">Идеально на телефоне, планшете и десктопе. Понятно для каждого и удобно поддерживать спустя годы.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"station\" data-band=\"7\" style=\"position:absolute;max-width:780px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#9b8dff\">−1000 М · ОСНОВАНИЕ<\u002Fspan>\n          <h2 style=\"margin:0;font-size:clamp(32px,5.4vw,72px);line-height:1.0;font-weight:700;letter-spacing:-.02em;color:#f3fbff\">Я строю сайты глубже,<br>чем кажется<\u002Fh2>\n          <p style=\"margin:0;max-width:520px;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#c2d8ec\">От идеи на поверхности до прочного фундамента внизу.<\u002Fp>\n          <a href=\"#services\" style=\"margin-top:8px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:#fff;text-decoration:none;padding:14px 28px;border-radius:999px;background:#2f6fe0;box-shadow:0 8px 28px rgba(40,110,230,.4)\" style-hover=\"box-shadow:0 12px 36px rgba(40,110,230,.6)\">Смотреть услуги ↓<\u002Fa>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SURFACING (smooth dark→light) ============ -->\n  <div style=\"position:relative;height:64vh;background:linear-gradient(180deg,#06182f 0%,#0a2c4e 24%,#13558a 50%,#2f7fc4 70%,#9cc6e8 87%,#eef3fa 100%);overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background-image:url(&quot;82f1f690-a3ea-430c-87d9-43f58e0344b8&quot;);background-size:cover;background-position:center;opacity:.28;mix-blend-mode:screen;animation:gridflow 14s linear infinite;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 34%,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 34%,#000 74%,transparent 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;bottom:0;text-align:center;padding-bottom:clamp(28px,5vh,52px)\">\n      <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.16em;color:#1d4e86\">ВЫХОДИМ НА ПОВЕРХНОСТЬ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ================= SERVICES ================= -->\n  <section id=\"services\" style=\"position:relative;padding:clamp(70px,9vh,120px) clamp(22px,6vw,90px) clamp(90px,12vh,150px);background:#eef3fa;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background-image:url(&quot;82f1f690-a3ea-430c-87d9-43f58e0344b8&quot;);background-size:cover;background-position:center;opacity:.08\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,#eef3fa 0%,rgba(238,243,250,.6) 30%,rgba(238,243,250,.6) 70%,#eef3fa 100%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1180px;margin:0 auto\">\n      <div class=\"rv\" style=\"text-align:center;margin-bottom:clamp(46px,7vh,82px)\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.18em;color:#2f6fe0\">УСЛУГИ<\u002Fspan>\n        <h2 style=\"margin:18px 0 0;font-size:clamp(32px,5vw,62px);font-weight:700;letter-spacing:-.02em;color:#16263b\">Что я создаю<\u002Fh2>\n        <p style=\"margin:16px auto 0;max-width:540px;font-size:clamp(15px,1.6vw,18px);line-height:1.6;color:#5a6b80\">Каждый проект — от наброска до запуска. Сделано так, чтобы работало на всех уровнях.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:clamp(16px,2vw,24px)\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div class=\"rv\" style=\"position:relative;padding:32px 28px 34px;border-radius:18px;background:#ffffff;border:1px solid rgba(40,90,160,.1);box-shadow:0 10px 30px rgba(30,60,110,.06);transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s,box-shadow .4s\" style-hover=\"transform:translateY(-8px);border-color:rgba(47,111,224,.45);box-shadow:0 22px 48px rgba(30,60,110,.16)\">\n            <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#2f6fe0\">{{ s.num }}<\u002Fspan>\n            <h3 style=\"margin:20px 0 0;font-size:23px;font-weight:600;color:#16263b\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:15px;line-height:1.55;color:#5a6b80\">{{ s.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTACT ================= -->\n  <section id=\"contact\" style=\"position:relative;padding:clamp(70px,10vh,130px) clamp(20px,5vw,70px) clamp(70px,9vh,110px);background:#eef3fa;overflow:hidden\">\n    <div class=\"rv\" style=\"position:relative;max-width:980px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 40px 90px rgba(10,28,66,.38);border:1px solid rgba(90,150,225,.28)\">\n      <div style=\"position:absolute;inset:0;overflow:hidden;background:#03060f\">\n        <div style=\"position:absolute;inset:0;background-image:url(&quot;aa9e5864-8278-4da8-acf5-73494743ba3e&quot;);background-size:cover;background-position:center 47%;transform-origin:50% 47%;animation:dive 13s linear infinite;will-change:transform,opacity\"><\u002Fdiv>\n        <div class=\"j-dive-2\" style=\"position:absolute;inset:0;background-image:url(&quot;aa9e5864-8278-4da8-acf5-73494743ba3e&quot;);background-size:cover;background-position:center 47%;transform-origin:50% 47%;animation:dive 13s linear infinite;animation-delay:-6.5s;will-change:transform,opacity\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(30% 24% at 50% 47%,rgba(70,150,255,.55),rgba(40,110,230,.12) 45%,transparent 72%);animation:glowpulse 4.5s ease-in-out infinite\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:radial-gradient(78% 58% at 50% 47%,rgba(4,12,28,.06) 0%,rgba(4,10,24,.62) 58%,rgba(3,8,20,.9) 100%),linear-gradient(180deg,rgba(3,8,20,.74) 0%,rgba(3,8,20,.3) 33%,rgba(3,8,20,.44) 63%,rgba(2,6,16,.9) 100%)\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:560px;margin:0 auto;text-align:center;padding:clamp(50px,7vw,88px) clamp(22px,5vw,52px)\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.18em;color:#7fc4ff;text-shadow:0 0 16px rgba(80,170,255,.6)\">КОНТАКТ<\u002Fspan>\n          <h2 style=\"margin:18px 0 0;font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;color:#f3fbff;text-shadow:0 4px 30px rgba(0,10,30,.7)\">Готовы погрузиться глубже?<\u002Fh2>\n          <p style=\"margin:16px auto 0;max-width:440px;font-size:clamp(15px,1.7vw,18px);line-height:1.6;color:#c2d8ec\">Расскажите о проекте — отвечу в течение дня и предложу, как сделать вашу «вершину» прочной до самого дна.<\u002Fp>\n        <\u002Fdiv>\n        <form onsubmit=\"{{ submit }}\" class=\"rv\" style=\"margin-top:38px;display:flex;flex-direction:column;gap:14px;text-align:left\">\n          <input value=\"{{ name }}\" oninput=\"{{ onName }}\" placeholder=\"Ваше имя\" style=\"width:100%;padding:15px 18px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.24);color:#eaf4fb;font-family:inherit;font-size:15px;outline:none\" style-focus=\"border-color:#7fc4ff\">\n          <input value=\"{{ email }}\" oninput=\"{{ onEmail }}\" placeholder=\"Email или телефон\" style=\"width:100%;padding:15px 18px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.24);color:#eaf4fb;font-family:inherit;font-size:15px;outline:none\" style-focus=\"border-color:#7fc4ff\">\n          <textarea value=\"{{ msg }}\" oninput=\"{{ onMsg }}\" placeholder=\"Коротко о задаче\" rows=\"4\" style=\"width:100%;padding:15px 18px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.24);color:#eaf4fb;font-family:inherit;font-size:15px;outline:none;resize:vertical\" style-focus=\"border-color:#7fc4ff\"><\u002Ftextarea>\n          <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:#ff9bb2\">{{ error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button type=\"submit\" disabled=\"{{ sending }}\" style=\"margin-top:4px;padding:16px 28px;border:none;border-radius:999px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;cursor:pointer;background:#2f6fe0;box-shadow:0 10px 30px rgba(40,110,230,.38)\" style-hover=\"box-shadow:0 14px 40px rgba(40,110,230,.58)\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fform>\n        <div class=\"rv\" style=\"margin-top:30px;font-size:14px;color:#aebfd4\">или напишите напрямую: <a href=\"mailto:studio.glubina@gmail.com\" style=\"color:#7fc4ff;text-decoration:none;font-weight:600\">studio.glubina@gmail.com<\u002Fa><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"lb-panel\" style=\"padding:8px 0 4px\">\n          <div style=\"width:58px;height:58px;margin:0 auto;border-radius:50%;border:2px solid #7fc4ff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(90,170,255,.5)\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5 10 17.5 19 7\" stroke=\"#7fc4ff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin:22px 0 0;font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em;color:#f3fbff;text-shadow:0 4px 30px rgba(0,10,30,.7)\">Заявка получена<\u002Fh3>\n          <p style=\"margin:14px auto 0;max-width:400px;font-size:16px;line-height:1.6;color:#c2d8ec\">Спасибо! Свяжусь с вами в течение дня. А пока — залетайте в мои соцсети:<\u002Fp>\n          <div style=\"margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px\">\n            <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;text-decoration:none;color:#eaf4fb;font-size:15px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.28);transition:background .3s,transform .3s\" style-hover=\"background:rgba(127,196,255,.2);transform:translateY(-3px)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#7fc4ff\"><path d=\"M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.6Z\"><\u002Fpath><\u002Fsvg>Telegram<\u002Fa>\n            <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;text-decoration:none;color:#eaf4fb;font-size:15px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.28);transition:background .3s,transform .3s\" style-hover=\"background:rgba(127,196,255,.2);transform:translateY(-3px)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#7fc4ff\"><path d=\"M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.4 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5c-.2.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.2.1.7-.1 1.3Z\"><\u002Fpath><\u002Fsvg>WhatsApp<\u002Fa>\n            <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;text-decoration:none;color:#eaf4fb;font-size:15px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.28);transition:background .3s,transform .3s\" style-hover=\"background:rgba(127,196,255,.2);transform:translateY(-3px)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7fc4ff\" stroke-width=\"1.9\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"1.1\" fill=\"#7fc4ff\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>Instagram<\u002Fa>\n            <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;text-decoration:none;color:#eaf4fb;font-size:15px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(140,190,255,.28);transition:background .3s,transform .3s\" style-hover=\"background:rgba(127,196,255,.2);transform:translateY(-3px)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#7fc4ff\"><path d=\"M12.8 16.9c-5.5 0-8.9-3.8-9-10.1h2.8c.1 4.6 2.2 6.5 3.8 6.9V6.8h2.6v3.9c1.6-.2 3.3-2 3.9-3.9h2.6c-.4 2.3-2 4.1-3.2 4.9 1.2.6 3 2.2 3.7 4.2h-2.9c-.5-1.6-2-2.8-4.1-3v3h-.3Z\"><\u002Fpath><\u002Fsvg>ВКонтакте<\u002Fa>\n          <\u002Fdiv>\n          <p style=\"margin:22px 0 0;font-size:13px;color:#8ba2bb\">ссылки на соцсети добавим позже<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#16263b;padding:34px clamp(22px,6vw,90px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <img src=\"60647d61-ca31-46c5-a317-b69e1302e463\" alt=\"ГЛУБИНА\" style=\"width:24px;height:24px;border-radius:6px;display:block\">\n      <span style=\"font-weight:700;letter-spacing:.28em;font-size:13px;color:#eaf2fa\">ГЛУБИНА<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:18px\">\n      <a href=\"https://studioglubina.ru\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#7fc4ff;text-decoration:none\" style-hover=\"color:#a9d8ff\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>studioglubina.ru<\u002Fa>\n      <span style=\"font-size:13px;color:#8fa3ba\">© 2026 · Создано с заботой о деталях<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;maxDepth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:100,&quot;max&quot;:5000,&quot;step&quot;:100,&quot;unit&quot;:&quot; м&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Айсберг&quot;},&quot;icebergParallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Айсберг&quot;}}\">\nclass Component extends DCLogic {\n  state = { name:'', email:'', msg:'', sent:false, sending:false, error:'', active:null };\n\n  renderVals() {\n    return {\n      rootRef: (el)=>{ this.rootEl = el; },\n      journeyRef: (el)=>{ this.journeyEl = el; },\n      services: [\n        { num:'01', title:'Лендинги', desc:'Одностраничные сайты, которые ведут к одному действию — и продают.' },\n        { num:'02', title:'Корпоративные сайты', desc:'Достойное представительство компании в сети, с понятной структурой.' },\n        { num:'03', title:'Анимации и переходы', desc:'Движение, которое запоминается и делает интерфейс живым.' },\n      ],\n      name: this.state.name, email: this.state.email, msg: this.state.msg,\n      sent: this.state.sent, notSent: !this.state.sent, error: this.state.error,\n      sending: this.state.sending,\n      submitLabel: this.state.sending ? 'Отправляю…' : 'Отправить заявку →',\n      onName:(e)=>this.setState({name:e.target.value}),\n      onEmail:(e)=>this.setState({email:e.target.value}),\n      onMsg:(e)=>this.setState({msg:e.target.value}),\n      submit: async (e)=>{\n        e.preventDefault();\n        if(this.state.sending) return;\n        if(!this.state.name.trim() || !this.state.email.trim()){\n          this.setState({error:'Пожалуйста, заполните имя и контакт.'}); return;\n        }\n        this.setState({sending:true, error:''});\n        try {\n          const fd = new FormData();\n          fd.append('Имя', this.state.name);\n          fd.append('Контакт', this.state.email);\n          fd.append('Сообщение', this.state.msg);\n          const res = await fetch('https://formspree.io/f/mbdvzpdp', {\n            method:'POST', headers:{'Accept':'application/json'}, body: fd\n          });\n          if(res.ok){ this.setState({sent:true, sending:false}); }\n          else { this.setState({sending:false, error:'Не удалось отправить. Попробуйте ещё раз или напишите на почту.'}); }\n        } catch(err){\n          this.setState({sending:false, error:'Нет соединения. Попробуйте ещё раз или напишите на почту.'});\n        }\n      },\n    };\n  }\n\n  componentDidMount(){\n    const maxDepth = this.props.maxDepth ?? 1000;\n    const parallax = this.props.icebergParallax !== false;\n    const j = this.journeyEl;\n    if(!j) return;\n    this.img = j.querySelector('.j-img');\n    this.overlay = j.querySelector('.j-overlay');\n    this.depthEl = j.querySelector('.depth-val');\n    this.marker = j.querySelector('.depth-marker');\n    this.bottomFade = j.querySelector('.j-bottomfade');\n    this.hint = j.querySelector('.scroll-hint');\n    this.stations = Array.from(j.querySelectorAll('.station'));\n    this.nav = (this.rootEl||document).querySelector('.nav');\n    this.bands = [[0,0.085],[0.115,0.205],[0.235,0.325],[0.355,0.445],[0.475,0.565],[0.595,0.685],[0.715,0.805],[0.84,1.01]];\n\n    const sc = this.rootEl;\n    this.getScroll = ()=> sc ? sc.scrollTop : (window.scrollY||0);\n    this.measure = ()=>{\n      this.vh = sc ? sc.clientHeight : window.innerHeight;\n      this.jTop = j.offsetTop;\n      this.jH = j.offsetHeight;\n      this.imgH = this.img ? this.img.offsetHeight : this.vh;\n    };\n    this.curP = 0;\n    // sets the TARGET depth from scroll + handles discrete toggles (bands/nav/reveals)\n    this.update = ()=>{\n      const sy = this.getScroll();\n      const total = this.jH - this.vh;\n      let p = total>0 ? (sy - this.jTop)/total : 0;\n      p = Math.max(0, Math.min(1, p));\n      this.targetP = p;\n      this.bands.forEach((b,i)=>{\n        if(this.stations[i]) this.stations[i].classList.toggle('on', p>=b[0] && p<=b[1]);\n      });\n      if(this.nav) this.nav.classList.toggle('nav-solid', sy > this.vh*0.55);\n      if(this.hint) this.hint.style.opacity = p<0.04 ? '1' : '0';\n      if(this.revealEls){\n        const h = sc ? sc.clientHeight : window.innerHeight;\n        for(let i=this.revealEls.length-1;i>=0;i--){\n          const el = this.revealEls[i];\n          if(el.getBoundingClientRect().top < h*0.86){ el.classList.add('rv-on'); this.revealEls.splice(i,1); }\n        }\n      }\n    };\n    // applies smoothed visuals every frame from this.curP\n    this.applyVisuals = ()=>{\n      const p = this.curP;\n      if(this.img && parallax){\n        const range = Math.max(0, this.imgH - this.vh);\n        this.img.style.transform = `translate(-50%, ${-(range*p).toFixed(2)}px)`;\n      }\n      if(this.overlay) this.overlay.style.opacity = (0.14 + 0.5*p + 0.32*Math.pow(p,4)).toFixed(3);\n      if(this.bottomFade) this.bottomFade.style.opacity = Math.max(0, Math.min(1,(p-0.5)/0.32)).toFixed(3);\n      if(this.depthEl) this.depthEl.textContent = Math.round(p*maxDepth);\n      if(this.marker) this.marker.style.top = (8 + p*84).toFixed(2) + '%';\n    };\n    this.onScroll = ()=>{ this.update(); };\n    this._targets = [sc, window];\n    this._targets.forEach(t=>t && t.addEventListener('scroll', this.onScroll, {passive:true}));\n    window.addEventListener('resize', ()=>{ this.measure(); this.update(); });\n    // rAF loop: reliably picks up scroll position even where scroll events are throttled\n    this._lastS = -1; this._ran = false; this.targetP = 0;\n    const loop = ()=>{\n      this._ran = true;\n      const s = this.getScroll();\n      if(s !== this._lastS){ this._lastS = s; this.update(); }\n      // ease curP toward targetP for buttery motion\n      this.curP += (this.targetP - this.curP) * 0.085;\n      if(Math.abs(this.targetP - this.curP) < 0.0002) this.curP = this.targetP;\n      this.applyVisuals();\n      this._raf = requestAnimationFrame(loop);\n    };\n    this._raf = requestAnimationFrame(loop);\n    // safety: if rAF never runs (e.g. backgrounded render), never leave content hidden\n    setTimeout(()=>{ if(!this._ran && this.revealEls){ this.revealEls.forEach(el=>el.classList.add('rv-on')); this.revealEls=[]; } }, 1400);\n\n    this.revealEls = Array.from((this.rootEl||document).querySelectorAll('.rv'));\n\n    setTimeout(()=>{ this.measure(); this.update(); }, 120);\n    window.addEventListener('load', ()=>{ this.measure(); this.update(); });\n  }\n\n  componentWillUnmount(){\n    if(this.onScroll && this._targets) this._targets.forEach(t=>t.removeEventListener('scroll', this.onScroll));\n    if(this._raf) cancelAnimationFrame(this._raf);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
